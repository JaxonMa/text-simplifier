<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Simplifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">Text Simplifier</h1>
            </div>
            <div class="header-right">
                <div id="modelBubble" class="model-bubble" role="status" aria-live="polite"></div>
                <button id="modelBadgeBtn" class="model-badge" type="button" aria-expanded="false" aria-controls="configPanel">
                    <span class="model-label">Model:</span>
                    <span class="model-value" id="modelDisplay">Loading...</span>
                    <span class="badge-arrow" aria-hidden="true">
                        <svg viewBox="0 0 24 24" class="icon-svg">
                            <path d="M6 9l6 6 6-6" />
                        </svg>
                    </span>
                </button>
            </div>
        </header>

        <!-- Model Configuration Panel -->
        <div class="config-panel" id="configPanel">
            <div class="config-panel-inner">
                <div class="config-title">Model Configuration</div>
                <div class="config-grid">
                    <div class="config-item">
                        <label for="configBaseUrl">Base URL</label>
                        <input 
                            type="text" 
                            id="configBaseUrl" 
                            class="config-input" 
                            placeholder="e.g., https://api.openai.com/v1"
                        >
                    </div>
                    <div class="config-item">
                        <label for="configModel">Model</label>
                        <input 
                            type="text" 
                            id="configModel" 
                            class="config-input" 
                            placeholder="e.g., gpt-4o-mini"
                        >
                    </div>
                    <div class="config-item">
                        <label for="configApiKey">API Key</label>
                        <input 
                            type="password" 
                            id="configApiKey" 
                            class="config-input" 
                            placeholder="Your API key"
                        >
                    </div>
                </div>
                <div class="config-actions">
                    <button id="confirmBtn" class="btn btn-primary" type="button">
                        <span class="btn-text">Confirm</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel: Input -->
            <div class="panel input-panel">
                <div class="panel-header">
                    <div class="panel-header-group">
                        <div class="panel-label">Original Text</div>
                        <span class="word-count" id="inputWordCount" aria-label="Input word count">0</span>
                        <span class="word-count">words</span>
                    </div>
                    <div class="panel-actions">
                        <button id="simplifyBtn" class="btn btn-secondary" type="button" title="Simplify text" aria-label="Simplify text">
                            <span class="btn-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" class="icon-svg" aria-hidden="true">
                                    <path d="M12 4l1.7 4.3L18 10l-4.3 1.7L12 16l-1.7-4.3L6 10l4.3-1.7L12 4z" />
                                    <path d="M18.5 14.4l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z" />
                                </svg>
                            </span>
                            <span class="btn-text">SIMPLIFY</span>
                        </button>
                        <button id="pasteBtn" class="btn btn-secondary icon-button" type="button" title="Paste from clipboard" aria-label="Paste from clipboard">
                            <span class="btn-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" class="icon-svg" aria-hidden="true">
                                    <rect x="6" y="5" width="12" height="16" rx="1.5" />
                                    <path d="M9 5V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V5" />
                                    <path d="M9 11h6M9 15h4" />
                                </svg>
                            </span>
                        </button>
                        <button id="clearBtn" class="btn btn-secondary icon-button" type="button" title="Clear all text" aria-label="Clear text">
                            <span class="btn-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" class="icon-svg" aria-hidden="true">
                                    <path d="M4 7h16M9 7V4h6v3M7 7l1 12h8l1-12" />
                                </svg>
                            </span>
                        </button>
                    </div>
                </div>
                <textarea 
                    id="inputText" 
                    class="text-area" 
                    placeholder="Paste or enter your text here..."
                ></textarea>
            </div>

            <!-- Right Panel: Output -->
            <div class="panel output-panel">
                <div class="panel-header">
                    <div class="panel-header-group">
                        <div class="panel-label">Simplified Result</div>
                        <span class="word-count" id="outputWordCount" aria-label="Output word count">0</span>
                        <span class="word-count">words</span>
                    </div>
                    <button id="copyBtn" class="btn btn-secondary icon-button" type="button" title="Copy simplified text to clipboard" aria-label="Copy simplified text">
                        <span class="btn-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" class="icon-svg" aria-hidden="true">
                                <rect x="9" y="9" width="11" height="11" rx="1.5" />
                                <path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15" />
                            </svg>
                        </span>
                    </button>
                </div>
                <div id="outputDisplay" class="output-display" data-empty="true">
                    <textarea id="outputText" class="text-area" readonly tabindex="-1" aria-label="Simplified result"></textarea>
                    <span class="placeholder-text">Your simplified text will appear here</span>
                    <div class="loading-indicator" role="status" aria-live="polite">
                        <span class="spinner" aria-hidden="true"></span>
                        <span>Simplifying...</span>
                        <span>It may take some time.</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span class="footer-text">A web application for simplifying long text using an AI completion API.</span>
            <a class="footer-link" href="https://github.com/JaxonMa/text-simplifier" target="_blank" rel="noopener noreferrer">View on <b>GitHub</b></a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/logic.js') }}"></script>
</body>
</html>
